name: Build doc
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      samples_ref:
        description: Branch/tag of CX-Box/cxbox-code-samples used for code snippets
        default: main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: pip install --force-reinstall -v "setuptools==71.0.0"
      - run: pip install --force-reinstall -v "mkdocs-material==9.2.5"
      - name: Check out code samples
        uses: actions/checkout@v4
        with:
          repository: CX-Box/cxbox-code-samples
          ref: ${{ inputs.samples_ref || 'main' }}
          path: code-samples
          sparse-checkout: src/main/java/org/demo/documentation
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare MkDocs snippets
        run: bash scripts/prepare-snippets.sh code-samples demo
      - run: pip install --no-cache-dir mkdocs-redirects
      - run: pip install --no-cache-dir mkdocs-markdownextradata-plugin
      - run: pip install --no-cache-dir mkdocs-mermaid2-plugin
      - run: mkdocs gh-deploy --force

  # --- Telegram notifications (secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) ---
  # main: message when the deploy starts and when it finishes (success / failure; a cancelled run sends nothing). Other branches: message only if something failed.
  notify-start:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/telegram-notify.yml
    secrets: inherit
    with:
      status: started

  notify-result:
    needs: [deploy]
    if: always() && (contains(needs.*.result, 'failure') || (github.ref == 'refs/heads/main' && !contains(needs.*.result, 'cancelled')))
    uses: ./.github/workflows/telegram-notify.yml
    secrets: inherit
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
